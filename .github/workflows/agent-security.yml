name: Agent Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-agent-surface:
    name: Audit AI-facing instructions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - name: Audit agent-facing files
        run: node scripts/audit-agent-surface.mjs
